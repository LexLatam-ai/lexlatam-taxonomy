name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tooling dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate canonical taxonomy data
        run: pnpm run validate

      - name: Regenerate bindings
        run: pnpm run generate

      - name: Fail if committed generated files are stale
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Generated bindings are out of date."
            echo "Run 'pnpm run generate' and commit the result."
            git status --short --untracked-files=all
            exit 1
          fi

      # --- Python package ---------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"

      - name: Install Python package
        working-directory: python
        run: poetry install --no-interaction

      - name: Run Python tests
        working-directory: python
        run: poetry run pytest

      - name: Build and install Python release artifact
        working-directory: python
        run: |
          poetry build
          python -m venv "$RUNNER_TEMP/python-smoke"
          "$RUNNER_TEMP/python-smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/python-smoke/bin/python" -c "from lexlatam_taxonomy import LegalSubject, legal_subject_label; assert legal_subject_label(LegalSubject.EMPLOYMENT) == 'Laboral'"

      # --- TypeScript package ----------------------------------------------
      - name: Install TypeScript package
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Type-check TypeScript package
        working-directory: typescript
        run: pnpm run typecheck

      - name: Build TypeScript package
        working-directory: typescript
        run: pnpm run build

      - name: Run TypeScript tests
        working-directory: typescript
        run: pnpm test

      - name: Pack and install TypeScript release artifact
        working-directory: typescript
        run: |
          PACKAGE=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          mkdir -p "$RUNNER_TEMP/npm-smoke"
          npm install --prefix "$RUNNER_TEMP/npm-smoke" "$RUNNER_TEMP/$PACKAGE"
          cd "$RUNNER_TEMP/npm-smoke"
          node --input-type=module -e "import('@lexlatam-ai/taxonomy').then(({ legalSubjectLabel }) => { if (legalSubjectLabel('employment') !== 'Laboral') process.exit(1) })"
