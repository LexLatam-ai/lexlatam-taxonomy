[project]
name = "lexlatam-taxonomy"
version = "1.3.0"
description = "Shared taxonomy contracts for LexLatam legal documents and subjects."
requires-python = ">=3.10,<4.0.0"
license = { text = "Proprietary - See LICENSE file. All rights reserved." }
authors = [{ name = "Invariant Engineering LLC", email = "contact@invariantengineering.com" }]
keywords = ["lexlatam", "gaceta", "panama", "taxonomy", "legal"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Repository = "https://github.com/LexLatam-ai/lexlatam-taxonomy"

[tool.poetry]
packages = [{ include = "lexlatam_taxonomy" }]
include = [
    { path = "lexlatam_taxonomy/data.json", format = ["sdist", "wheel"] },
    { path = "lexlatam_taxonomy/legal-subjects.json", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
